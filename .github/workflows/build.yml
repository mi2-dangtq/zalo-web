name: Build APK

on:
  push:
    branches: [main]
    # A README edit alone doesn't need a new APK (and version code).
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: write

# Two quick pushes build one after the other, so "Latest" is always the newest version code
# (the other order would make the newest release a downgrade that can't be installed).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        # Without the fixed keystore every runner signs with its own throwaway debug key, and no
        # such build can be installed over another one, so stop instead of publishing it.
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing - add it (see README) so the APK can update the installed app."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "ZaloWeb-$VERSION.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: ZaloWeb-${{ env.VERSION }}
          path: ZaloWeb-${{ env.VERSION }}.apk
          if-no-files-found: error
          # A re-run keeps the run number, so the artifact name repeats.
          overwrite: true

      - name: Publish GitHub Release
        # A manual run on another branch still builds (artifact above) but doesn't publish.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "ZaloWeb-$VERSION.apk" --clobber
          else
            gh release create "$TAG" "ZaloWeb-$VERSION.apk" \
              --target "$GITHUB_SHA" \
              --title "Zalo Web $VERSION" \
              --notes "Build #${{ github.run_number }} from ${GITHUB_SHA::7}. Tải file ZaloWeb-$VERSION.apk bên dưới và cài đè lên bản cũ."
          fi
