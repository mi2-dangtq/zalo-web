name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing - the APK will be signed with a throwaway debug key and cannot update a release-signed install."
          fi

      - name: Build release APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "ZaloWeb-$VERSION.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: ZaloWeb-${{ env.VERSION }}
          path: ZaloWeb-${{ env.VERSION }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "ZaloWeb-$VERSION.apk" --clobber
          else
            gh release create "$TAG" "ZaloWeb-$VERSION.apk" \
              --target "$GITHUB_SHA" \
              --title "Zalo Web $VERSION" \
              --notes "Build #${{ github.run_number }} from ${GITHUB_SHA::7}. Tải file ZaloWeb-$VERSION.apk bên dưới và cài đè lên bản cũ."
          fi
